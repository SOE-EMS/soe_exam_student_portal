<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login â€” SOE Examination Portal</title>
  <meta name="description" content="Admin login for Hall Ticket & Examination Management System">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-light: #2d5a8e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --surface: #ffffff;
      --bg: #f0f4f8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(30, 58, 95, 0.08);
      --shadow-lg: 0 12px 40px rgba(30, 58, 95, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: var(--text);
    }

    .login-wrapper {
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .logo-section {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .logo-section h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 4px;
      letter-spacing: -0.5px;
    }

    .logo-section p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: white;
      outline: none;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.25);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .student-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .student-link a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .student-link a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .alert {
      border-radius: 10px;
      font-size: 14px;
      border: none;
      padding: 12px 16px;
    }

    .alert-danger {
      background: #fef2f2;
      color: #991b1b;
    }

    .spinner-border-sm {
      width: 18px;
      height: 18px;
      border-width: 2px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>

  <!-- Responsive Overrides -->
  <link rel="stylesheet" href="/css/mobile-responsive.css">
  <script src="/js/mobile-nav.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
          </svg>
        </div>
        <h1>School of Engineering</h1>
        <p>Examination Management Portal</p>
      </div>

      <div id="alert-container"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="admin@soe.edu" required autocomplete="email">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="student-link">
        <a href="/student/login">Student Portal</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertContainer = document.getElementById('alert-container');
    const loginBtn = document.getElementById('loginBtn');

    function showAlert(message, type = 'danger') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}" role="alert">${message}</div>
      `;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please enter email and password.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          showAlert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
