<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — SOE Examination Portal</title>
  <meta name="description" content="Student dashboard - View eligibility and download hall tickets">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --accent: #06b6d4;
      --surface: #ffffff;
      --bg: #f0f4f8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      background: linear-gradient(135deg, var(--primary), #1e3a8a);
      padding: 20px 32px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(30,64,175,0.2);
    }

    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar small { opacity: 0.8; font-size: 13px; }

    .topbar-right { display: flex; align-items: center; gap: 16px; }

    .btn-logout-top {
      padding: 8px 16px; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; background: rgba(255,255,255,0.1); color: white;
      font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
      transition: all 0.2s; text-decoration: none;
    }

    .btn-logout-top:hover { background: rgba(255,255,255,0.2); }

    .container-main { max-width: 900px; margin: 0 auto; padding: 28px 20px; }

    /* ─── PROFILE CARD ─── */
    .profile-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
    }

    .profile-photo {
      width: 100px; height: 130px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border);
      position: relative;
    }

    .profile-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .profile-photo .photo-placeholder {
      width: 100%; height: 100%;
      background: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-size: 32px;
    }

    .photo-edit-btn {
      position: absolute; bottom: 4px; right: 4px;
      width: 28px; height: 28px;
      border-radius: 50%; border: none;
      background: var(--primary-light); color: white;
      font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .profile-info { flex: 1; }
    .profile-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .profile-field label {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .profile-field .value {
      font-size: 14px; font-weight: 600; color: var(--text);
    }

    /* ─── EXAM CARDS ─── */
    .section-title {
      font-size: 16px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    .exam-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 14px;
      transition: all 0.25s;
    }

    .exam-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .exam-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }

    .exam-name { font-size: 16px; font-weight: 600; }
    .exam-ay { font-size: 13px; color: var(--text-muted); }

    .badge-eligible {
      padding: 5px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }

    .badge-eligible.eligible { background: #ecfdf5; color: #059669; }
    .badge-eligible.not-eligible { background: #fef2f2; color: #dc2626; }
    .badge-eligible.pending { background: #fffbeb; color: #d97706; }
    .badge-eligible.overridden { border: 1.5px solid var(--primary-light); }

    .exam-actions { margin-top: 12px; }

    .btn-download {
      padding: 10px 20px; border: none;
      border-radius: 8px; font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: inline-flex;
      align-items: center; gap: 8px;
    }

    .btn-download.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
    }

    .btn-download.active:hover {
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
      transform: translateY(-1px);
    }

    .btn-download.disabled {
      background: #f1f5f9; color: var(--text-muted);
      cursor: not-allowed;
    }

    .availability-note {
      font-size: 12px; color: var(--text-muted); margin-top: 8px;
    }

    .empty-state {
      text-align: center; padding: 48px; color: var(--text-muted);
    }

    .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }

    .alert { border-radius: 10px; font-size: 14px; border: none; }

    @media (max-width: 600px) {
      .profile-card { flex-direction: column; align-items: center; text-align: center; }
      .profile-grid { grid-template-columns: repeat(2, 1fr); }
      .topbar { padding: 16px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>

  <!-- Responsive Overrides -->
  <link rel="stylesheet" href="/css/mobile-responsive.css">
  <script src="/js/mobile-nav.js"></script>
</head>
<body>
  <div class="topbar">
    <div>
      <h1><i class="fas fa-graduation-cap" style="margin-right:8px"></i> Student Portal</h1>
      <small>School of Engineering — Examination Management</small>
    </div>
    <div class="topbar-right">
      <button class="btn-logout-top" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="container-main">
    <div id="alert-container"></div>

    <!-- PROFILE CARD -->
    <div class="profile-card" id="profileCard">
      <div class="profile-photo" id="profilePhoto">
        <div class="photo-placeholder"><i class="fas fa-user"></i></div>
      </div>
      <div class="profile-info">
        <h2 id="studentName">Loading...</h2>
        <div class="profile-grid">
          <div class="profile-field">
            <label>Enrollment No.</label>
            <div class="value" id="enrollmentNumber">—</div>
          </div>
          <div class="profile-field">
            <label>Program</label>
            <div class="value" id="program">—</div>
          </div>
          <div class="profile-field">
            <label>Semester</label>
            <div class="value" id="semester">—</div>
          </div>
          <div class="profile-field">
            <label>Division</label>
            <div class="value" id="division">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- EXAM LIST -->
    <div class="section-title"><i class="fas fa-file-alt" style="color:var(--primary)"></i> Examinations</div>
    <div id="examList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin"></i>
        <div>Loading examinations...</div>
      </div>
    </div>

    <!-- PHOTO UPLOAD MODAL -->
    <input type="file" id="photoInput" accept="image/jpeg,image/png" style="display:none">
  </div>

  <script>
    const alertContainer = document.getElementById('alert-container');

    function showAlert(msg, type = 'danger') {
      alertContainer.innerHTML = `<div class="alert alert-${type} mb-3">${msg}</div>`;
      setTimeout(() => { alertContainer.innerHTML = ''; }, 5000);
    }

    // Auth check
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (!data.authenticated || data.role !== 'STUDENT') {
          window.location.href = '/student/login';
        }
      } catch { window.location.href = '/student/login'; }
    }
    checkAuth();

    // Load dashboard
    async function loadDashboard() {
      try {
        const res = await fetch('/api/student/dashboard');
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();

        // Profile
        const s = data.student;
        document.getElementById('studentName').textContent = s.name;
        document.getElementById('enrollmentNumber').textContent = s.enrollmentNumber;
        document.getElementById('program').textContent = s.program;
        document.getElementById('semester').textContent = 'Sem ' + s.semester;
        document.getElementById('division').textContent = s.division || '—';

        if (s.photoUrl) {
          document.getElementById('profilePhoto').innerHTML =
            `<img src="${s.photoUrl}" alt="Student Photo">
             <button class="photo-edit-btn" onclick="document.getElementById('photoInput').click()" title="Change Photo"><i class="fas fa-camera"></i></button>`;
        } else {
          document.getElementById('profilePhoto').innerHTML =
            `<div class="photo-placeholder"><i class="fas fa-user"></i></div>
             <button class="photo-edit-btn" onclick="document.getElementById('photoInput').click()" title="Upload Photo"><i class="fas fa-camera"></i></button>`;
        }

        // Exams
        const examList = document.getElementById('examList');
        if (!data.exams || data.exams.length === 0) {
          examList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><div>No examinations found.</div></div>';
          return;
        }

        examList.innerHTML = data.exams.map(exam => {
          const statusClass = exam.eligibility === 'ELIGIBLE' ? 'eligible'
            : exam.eligibility === 'NOT_ELIGIBLE' ? 'not-eligible' : 'pending';
          const overrideClass = exam.isOverridden ? ' overridden' : '';
          const statusLabel = exam.eligibility === 'ELIGIBLE' ? '✓ Eligible'
            : exam.eligibility === 'NOT_ELIGIBLE' ? '✗ Not Eligible' : '◌ Pending';

          let actionHtml = '';
          if (exam.hallTicketAvailable) {
            actionHtml = `<button class="btn-download active" onclick="downloadHallTicket('${exam.examId}')">
              <i class="fas fa-download"></i> Download Hall Ticket
            </button>`;
          } else if (exam.eligibility === 'ELIGIBLE') {
            let note = 'Hall ticket not yet available.';
            if (exam.availableFrom) {
              note = `Available from ${new Date(exam.availableFrom).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}`;
            }
            actionHtml = `<button class="btn-download disabled" disabled>
              <i class="fas fa-clock"></i> Not Available
            </button>
            <div class="availability-note">${note}</div>`;
          }

          return `<div class="exam-card">
            <div class="exam-header">
              <div>
                <div class="exam-name">${exam.examName}</div>
                <div class="exam-ay">${exam.academicYear}</div>
              </div>
              <span class="badge-eligible ${statusClass}${overrideClass}">${statusLabel}</span>
            </div>
            <div class="exam-actions">${actionHtml}</div>
          </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('examList').innerHTML =
          '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div>Failed to load data.</div></div>';
      }
    }
    loadDashboard();

    // Download hall ticket
    async function downloadHallTicket(examId) {
      try {
        const res = await fetch(`/api/student/hall-ticket/${examId}`);
        if (!res.ok) {
          const data = await res.json();
          showAlert(data.error || 'Failed to download.');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'hall_ticket.pdf';
        a.click();
        URL.revokeObjectURL(url);
      } catch {
        showAlert('Network error downloading hall ticket.');
      }
    }

    // Photo upload
    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { showAlert('Photo must be under 2MB.'); return; }

      const formData = new FormData();
      formData.append('photo', file);

      try {
        const res = await fetch('/api/student/update-photo', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          showAlert('Photo updated successfully!', 'success');
          loadDashboard();
        } else {
          showAlert(data.error || 'Failed to update photo.');
        }
      } catch { showAlert('Network error.'); }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
      window.location.href = '/student/login';
    });
  </script>
</body>
</html>
